[package]
name = "ael3"
version = "3.0.0"
edition = "2021"
description = "AEL3 — AI Engineering Ledger (Tauri backend)"
default-run = "ael3"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ael3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
zip = "9.1"
sha1 = "0.10"
regex = "1"
log = "0.4"
portable-pty = "0.9"
ureq = "2"
toml = "0.8"
agent-client-protocol = "2.1.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
